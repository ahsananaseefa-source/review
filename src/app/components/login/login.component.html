<h2>Login Page</h2>

<form (ngSubmit)="login()">

  <label>Username:</label>

  <input
    type="text"
    name="username"
    [(ngModel)]="username"
    required
  >

  <br><br>

  <label>Password:</label>

  <input
    type="password"
    name="password"
    [(ngModel)]="password"
    required
  >

  <br><br>

  <button type="submit">Login</button>

</form>

<p>{{ errorMessage }}</p>
